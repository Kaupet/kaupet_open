pre-commit:
  commands:
    format:
      # Hold denne i sync med hva `prettier --check .` dekker i CI — ellers
      # slipper en filtype gjennom hooken og felles først på PR-en. `html` kom
      # med etter at capacitor-shell/*.html gjorde nettopp det.
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,css,json,md,html,yml,yaml}"
      run: bunx prettier --write --cache --cache-strategy content --cache-location node_modules/.cache/kaupet-quality/prettier {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: bunx eslint --cache --cache-strategy content --cache-location node_modules/.cache/kaupet-quality/eslint {staged_files}

pre-push:
  commands:
    typecheck:
      run: bun run typecheck
