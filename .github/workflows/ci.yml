name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Nyere kjøringer av samme PR/gren avbryter eldre; main avbrytes aldri.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # Eksplisitt navn: dette er statusnavnet grenbeskyttelsen krever.
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      # Build generates the route types used by typecheck and lint.
      - name: Build
        run: bun run build
      - name: Check formatting
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint:ci
      - name: Test
        run: bun run test:coverage
      - name: Check dependencies
        run: bun audit --audit-level=high
