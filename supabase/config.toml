# kaupet_open: local development only; hosted Auth is configured separately.
project_id = "kaupet-open"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:8080"
additional_redirect_urls = [
  "http://127.0.0.1:8080/auth**",
  "http://localhost:8080/auth**",
  "http://127.0.0.1:8080/tilbakestill-passord",
  "http://localhost:8080/tilbakestill-passord",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 10

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local Mailpit captures mail. Enable confirmations with your own SMTP in production.
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.email.smtp]
enabled = true
host = "inbucket"
port = 1025
user = "inbucket"
pass = "inbucket"
admin_email = "admin@example.com"
sender_name = "kaupet_open"

[auth.email.template.confirmation]
subject = "Bekreft e-postadressen din"
content_path = "./supabase/templates/confirmation.html"

[edge_runtime]
enabled = false

[analytics]
enabled = false
port = 54327
